<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uday Plastic — Coming Soon</title>
  <meta name="description"
    content="Uday Plastic is launching a new website soon. Quality plastic products, coming to udayplastic.org.">
  <meta name="theme-color" content="#0b3d5c">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b3d5c'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial' font-weight='700' text-anchor='middle' fill='%23ffb703'%3EU%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #071f31;
      --bg2: #0b3d5c;
      --accent: #ffb703;
      --text: #f4f8fb;
      --muted: #9db8cb;
      --card: rgba(255, 255, 255, .06);
      --border: rgba(255, 255, 255, .12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 700px at 80% -10%, var(--bg2) 0%, transparent 60%),
        radial-gradient(900px 600px at -10% 110%, #0e5a85 0%, transparent 55%),
        var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* floating shapes */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: .35;
      pointer-events: none;
      animation: float 14s ease-in-out infinite
    }

    .b1 {
      width: 320px;
      height: 320px;
      background: #1d8fd1;
      top: -80px;
      left: -60px
    }

    .b2 {
      width: 260px;
      height: 260px;
      background: var(--accent);
      bottom: -90px;
      right: 8%;
      opacity: .22;
      animation-delay: -5s
    }

    .b3 {
      width: 200px;
      height: 200px;
      background: #2ec4b6;
      top: 40%;
      right: -60px;
      opacity: .2;
      animation-delay: -9s
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0)
      }

      50% {
        transform: translate(24px, -28px)
      }
    }

    header {
      padding: 28px 24px;
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 1
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text)
    }

    .mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent);
      color: #0b3d5c;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 24px
    }

    .brand span {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: .3px
    }

    .brand small {
      display: block;
      font-size: .7rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 1
    }

    .wrap {
      max-width: 760px;
      width: 100%;
      text-align: center
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 999px;
      font-size: .8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 28px;
      backdrop-filter: blur(6px)
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.8s infinite
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 183, 3, .6)
      }

      70% {
        box-shadow: 0 0 0 10px rgba(255, 183, 3, 0)
      }

      100% {
        box-shadow: 0 0 0 0 rgba(255, 183, 3, 0)
      }
    }

    h1 {
      font-size: clamp(2.4rem, 7vw, 4.6rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 20px
    }

    h1 em {
      font-style: normal;
      color: var(--accent)
    }

    p.lead {
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      color: var(--muted);
      max-width: 560px;
      margin: 0 auto 36px;
      line-height: 1.6
    }


    .domain {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 12px;
      background: var(--accent);
      color: #0b3d5c;
      font-weight: 700;
      letter-spacing: .5px;
      text-decoration: none
    }

    footer {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
      position: relative;
      z-index: 1
    }

    @media (prefers-reduced-motion:reduce) {

      .blob,
      .dot {
        animation: none
      }
    }
  </style>
</head>

<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <header>
    <a class="brand" href="/" aria-label="Uday Plastic home">
      <div class="mark">U</div>
      <div><span>Uday Plastic</span><small>udayplastic.org</small></div>
    </a>
  </header>

  <main>
    <div class="wrap">
      <div class="pill"><span class="dot"></span> Launching Soon</div>
      <h1>Something <em>solid</em><br>is being moulded.</h1>
      <p class="lead">We're building our new website to showcase our plastic products and services. Thank you for your
        patience — please check back shortly.</p>



      <a class="domain" href="https://udayplastic.org">udayplastic.org</a>
    </div>
  </main>

  <footer>&copy; <span id="y">2026</span> Uday Plastic. All rights reserved.</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>

</html>
